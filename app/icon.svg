<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    枫叶修图 · 图标（矢量设计源）

    设计要点（都是实测出来的取舍，不是审美偏好）：
      1. **底色用饱和红渐变，叶子用白色** —— 在 48 / 32 / 24px 三档下测
         「叶内外亮度比」，这套是 2.73 / 2.74 / 2.84，六套候选里最高。
         图标缩到桌面最小尺寸时，决定能不能认出形状的不是细节，而是这个亮度差。
      2. **叶形用标准枫叶，不随手画** —— 采用加拿大国旗那片枫叶的官方路径
         （11 个尖角 + 叶柄 + 底部两撇）。缩小到 24px 时仍能一眼认出是枫叶，
         而不是「一片叶子」。
      3. **叶子占画布高度 60%、居中** —— 自适应图标（Android 8+）只保证
         中心 66.7% 可见，各厂商遮罩形状不同（圆形/方形/水滴/圆角矩形）。
         60% 留足了余量，任何遮罩都不会切到叶子。
      4. **顶部高光 + 叶周暖色光晕** —— 让叶子从底色里「浮」起来，
         缩小时边界更清楚；没有这两层，小尺寸下叶子会和底色糊在一起。

    本文件是**设计源**；tools/make-icons.js 用同一套配色与同一个叶形（展平成
    42 个顶点的多边形，与真实路径逐像素比对 IoU = 0.986）生成各平台 PNG。
    改图标请两边一起改 —— 回归测试会核对两者的配色与叶形是否一致。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7048"/>
      <stop offset="0.55" stop-color="#dc2318"/>
      <stop offset="1" stop-color="#8a0d0a"/>
    </linearGradient>
    <!-- 叶子：白 → 极浅暖白，给一点体积感（纯平涂会显得单薄） -->
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff0dd"/>
    </linearGradient>
    <!-- 顶部高光：与 PNG 生成器里的线性衰减一致（v<0.32 时按比例混白） -->
    <linearGradient id="hl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- 叶周暖色光晕：中心到 0.32 半径内不发光，向外渐强到 0.16 -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb37a" stop-opacity="0"/>
      <stop offset="0.32" stop-color="#ffb37a" stop-opacity="0"/>
      <stop offset="0.60" stop-color="#ffb37a" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffb37a" stop-opacity="0.16"/>
    </radialGradient>
    <clipPath id="clip"><rect width="512" height="512" rx="114"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#glow)"/>
    <rect width="512" height="164" fill="url(#hl)"/>

    <!--
      枫叶。路径是加拿大国旗枫叶的官方路径（原始坐标系里叶高 279、叶宽 255.6），
      下面这个 transform 把它等比缩放并居中到「叶高 = 0.60 × 512 = 307.2」：
        先平移到原点 → 缩放 1.10108 → 移到画布中心
      缩放后叶子占 x 115.3~396.7、y 102.4~409.6，完全落在自适应图标的安全区内。
    -->
    <path fill="url(#leaf)"
          transform="translate(256 256) scale(1.10108) translate(-315.5 -234.5)"
          d="M201 232l-13.3 4.4 61.4 54c4.7 13.7-1.6 17.8-5.6 25l66.6-8.4-1.6 67 13.9-.3-3.1-66.6 66.7 8c-4.1-8.7-7.8-13.3-4-27.2l61.3-51-10.7-4c-8.8-6.8 3.8-32.6 5.6-48.9 0 0-35.7 12.3-38 5.8l-9.2-17.5-32.6 35.8c-3.5.9-5-.5-5.9-3.5l15-74.8-23.8 13.4q-3.2 1.3-5.2-2.2l-23-46-23.6 47.8q-2.8 2.5-5 .7L264 130.8l13.7 74.1c-1.1 3-3.7 3.8-6.7 2.2l-31.2-35.3c-4 6.5-6.8 17.1-12.2 19.5s-23.5-4.5-35.6-7c4.2 14.8 17 39.6 9 47.7z"/>
  </g>
</svg>
